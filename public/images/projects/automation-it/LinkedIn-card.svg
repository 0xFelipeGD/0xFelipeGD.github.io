<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0f1e"/>
      <stop offset="100%" style="stop-color:#0d1a2e"/>
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0077b5;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#005f91;stop-opacity:0.9"/>
    </linearGradient>
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#059669;stop-opacity:0.9"/>
    </linearGradient>
    <linearGradient id="tgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#229ED9;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#1a7ab0;stop-opacity:0.9"/>
    </linearGradient>
    <linearGradient id="makeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#5b21b6;stop-opacity:0.9"/>
    </linearGradient>
    <linearGradient id="glowLI" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0077b5;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#0077b5;stop-opacity:0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)"/>

  <!-- Subtle grid lines -->
  <g stroke="#1e2d40" stroke-width="0.5" opacity="0.4">
    <line x1="0" y1="90" x2="800" y2="90"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="270" x2="800" y2="270"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="100" y1="0" x2="100" y2="450"/>
    <line x1="200" y1="0" x2="200" y2="450"/>
    <line x1="300" y1="0" x2="300" y2="450"/>
    <line x1="400" y1="0" x2="400" y2="450"/>
    <line x1="500" y1="0" x2="500" y2="450"/>
    <line x1="600" y1="0" x2="600" y2="450"/>
    <line x1="700" y1="0" x2="700" y2="450"/>
  </g>

  <!-- Glow orbs -->
  <circle cx="400" cy="225" r="180" fill="url(#glowLI)" opacity="0.4"/>
  <circle cx="100" cy="100" r="80" fill="#10b981" opacity="0.04"/>
  <circle cx="700" cy="350" r="100" fill="#0077b5" opacity="0.05"/>

  <!-- Flow connector lines -->
  <!-- CRON → n8n -->
  <line x1="120" y1="200" x2="195" y2="200" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,3"/>
  <polygon points="192,196 200,200 192,204" fill="#334155"/>
  <!-- n8n → AI -->
  <line x1="285" y1="200" x2="315" y2="200" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.7"/>
  <polygon points="312,196 320,200 312,204" fill="#10b981" opacity="0.7"/>
  <!-- AI → Telegram -->
  <line x1="405" y1="200" x2="435" y2="200" stroke="#229ED9" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.7"/>
  <polygon points="432,196 440,200 432,204" fill="#229ED9" opacity="0.7"/>
  <!-- Telegram → Make -->
  <line x1="525" y1="200" x2="555" y2="200" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.7"/>
  <polygon points="552,196 560,200 552,204" fill="#7c3aed" opacity="0.7"/>
  <!-- Make → LinkedIn -->
  <line x1="645" y1="200" x2="675" y2="200" stroke="#0077b5" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.7"/>
  <polygon points="672,196 680,200 672,204" fill="#0077b5" opacity="0.7"/>

  <!-- CRON Node -->
  <g filter="url(#glow)">
    <rect x="50" y="172" width="70" height="56" rx="10" fill="#111827" stroke="#334155" stroke-width="1.5"/>
    <text x="85" y="194" text-anchor="middle" fill="#6b7280" font-size="9" font-family="monospace">CRON</text>
    <text x="85" y="210" text-anchor="middle" fill="#f3f4f6" font-size="11" font-weight="bold" font-family="sans-serif">10:00</text>
    <text x="85" y="222" text-anchor="middle" fill="#6b7280" font-size="9" font-family="monospace">AM daily</text>
  </g>

  <!-- n8n Node -->
  <g filter="url(#glow)">
    <rect x="200" y="165" width="80" height="70" rx="12" fill="#1a1a2e" stroke="#ea4b71" stroke-width="1.5"/>
    <text x="240" y="190" text-anchor="middle" fill="#ea4b71" font-size="14" font-weight="bold" font-family="sans-serif">n8n</text>
    <text x="240" y="207" text-anchor="middle" fill="#9ca3af" font-size="8.5" font-family="sans-serif">Topic Select</text>
    <text x="240" y="220" text-anchor="middle" fill="#9ca3af" font-size="8.5" font-family="sans-serif">+ Orchestrate</text>
    <text x="240" y="230" text-anchor="middle" fill="#9ca3af" font-size="8" font-family="monospace">webhook out</text>
  </g>

  <!-- AI / OpenAI Node -->
  <g filter="url(#glow)">
    <rect x="320" y="165" width="80" height="70" rx="12" fill="#0d1f14" stroke="#10b981" stroke-width="1.5"/>
    <text x="360" y="190" text-anchor="middle" fill="#10b981" font-size="10" font-weight="bold" font-family="sans-serif">OpenAI</text>
    <text x="360" y="207" text-anchor="middle" fill="#9ca3af" font-size="8.5" font-family="sans-serif">Prompt Eng.</text>
    <text x="360" y="220" text-anchor="middle" fill="#9ca3af" font-size="8.5" font-family="sans-serif">Content Gen.</text>
    <text x="360" y="232" text-anchor="middle" fill="#6ee7b7" font-size="8" font-family="monospace">GPT-4o</text>
  </g>

  <!-- Telegram Node -->
  <g filter="url(#glow)">
    <rect x="440" y="165" width="80" height="70" rx="12" fill="#0d1a26" stroke="#229ED9" stroke-width="1.5"/>
    <!-- Telegram icon simplified -->
    <circle cx="480" cy="183" r="8" fill="#229ED9" opacity="0.2"/>
    <text x="480" y="187" text-anchor="middle" fill="#229ED9" font-size="10" font-family="sans-serif">✈</text>
    <text x="480" y="204" text-anchor="middle" fill="#9ca3af" font-size="8.5" font-family="sans-serif">Telegram</text>
    <text x="480" y="216" text-anchor="middle" fill="#9ca3af" font-size="8.5" font-family="sans-serif">Approval</text>
    <text x="480" y="228" text-anchor="middle" fill="#7dd3fc" font-size="8" font-family="monospace">human loop</text>
  </g>

  <!-- Make Node -->
  <g filter="url(#glow)">
    <rect x="560" y="165" width="80" height="70" rx="12" fill="#1a0f2e" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="600" y="193" text-anchor="middle" fill="#a78bfa" font-size="12" font-weight="bold" font-family="sans-serif">Make</text>
    <text x="600" y="210" text-anchor="middle" fill="#9ca3af" font-size="8.5" font-family="sans-serif">Webhook</text>
    <text x="600" y="222" text-anchor="middle" fill="#9ca3af" font-size="8.5" font-family="sans-serif">OAuth Flow</text>
    <text x="600" y="232" text-anchor="middle" fill="#c4b5fd" font-size="8" font-family="monospace">publish</text>
  </g>

  <!-- LinkedIn Node -->
  <g filter="url(#softGlow)">
    <rect x="680" y="162" width="84" height="76" rx="12" fill="#001f3d" stroke="#0077b5" stroke-width="2"/>
    <!-- LinkedIn "in" logo -->
    <rect x="695" y="174" width="22" height="22" rx="4" fill="#0077b5"/>
    <text x="706" y="190" text-anchor="middle" fill="white" font-size="13" font-weight="bold" font-family="serif">in</text>
    <text x="722" y="189" text-anchor="middle" fill="#60a5fa" font-size="8.5" font-family="sans-serif">Page</text>
    <text x="722" y="200" text-anchor="middle" fill="#60a5fa" font-size="8.5" font-family="sans-serif">Post</text>
    <text x="722" y="211" text-anchor="middle" fill="#60a5fa" font-size="7.5" font-family="sans-serif">+ Image</text>
    <text x="722" y="230" text-anchor="middle" fill="#93c5fd" font-size="7.5" font-family="monospace">published!</text>
  </g>

  <!-- Approval options bubble -->
  <g opacity="0.85">
    <rect x="390" y="265" width="220" height="100" rx="10" fill="#111827" stroke="#229ED9" stroke-width="1" stroke-dasharray="3,2"/>
    <text x="500" y="283" text-anchor="middle" fill="#229ED9" font-size="9" font-weight="bold" font-family="sans-serif">Telegram Options</text>
    <line x1="390" y1="288" x2="610" y2="288" stroke="#1e3a4a" stroke-width="0.5"/>
    <text x="400" y="303" fill="#6ee7b7" font-size="8.5" font-family="monospace">✓ Approve + image</text>
    <text x="400" y="317" fill="#f87171" font-size="8.5" font-family="monospace">⊘ Skip today</text>
    <text x="400" y="331" fill="#fbbf24" font-size="8.5" font-family="monospace">↺ Regenerate</text>
    <text x="400" y="345" fill="#a78bfa" font-size="8.5" font-family="monospace">✎ Edit manually</text>
    <text x="510" y="317" fill="#fb923c" font-size="8.5" font-family="monospace">⇄ Change topic</text>
  </g>
  <!-- Connector from Telegram to bubble -->
  <line x1="480" y1="235" x2="480" y2="265" stroke="#229ED9" stroke-width="1" stroke-dasharray="3,2" opacity="0.5"/>

  <!-- Title -->
  <text x="400" y="55" text-anchor="middle" fill="#f1f5f9" font-size="22" font-weight="bold" font-family="sans-serif" letter-spacing="0.5">LinkedIn Auto-Post</text>
  <text x="400" y="78" text-anchor="middle" fill="#64748b" font-size="12" font-family="sans-serif">AI · n8n · Telegram · Make · Human-in-the-Loop</text>

  <!-- Bottom bar -->
  <rect x="0" y="420" width="800" height="30" fill="#060d18" opacity="0.8"/>
  <circle cx="30" cy="435" r="5" fill="#10b981" opacity="0.8"/>
  <text x="42" y="439" fill="#475569" font-size="10" font-family="monospace">Automated · Daily · Consistent</text>
  <text x="720" y="439" text-anchor="middle" fill="#0077b5" font-size="10" font-weight="bold" font-family="sans-serif">LinkedIn</text>
</svg>
